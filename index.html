HTML
======
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📚 Author Data Matcher</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>📚 Author Data Matcher</h1>
        <p>Upload your <strong>Template CSV</strong> (the file to populate) and <strong>Data CSV</strong> (source of DOIs/UTs).
           The script will match authors by <em>EmailAddress</em> or <em>AuthorID</em>, pull DOIs/UTs, and clean duplicates.</p>

        <div class="upload-section">
            <label>📁 Upload Template (CSV):</label>
            <input type="file" id="templateFile" accept=".csv">

            <label>📁 Upload Data Files (CSV):</label>
            <input type="file" id="dataFiles" accept=".csv" multiple>

            <button id="processBtn" disabled>▶️ Process Files</button>
        </div>

        <div id="resultSection" style="display:none;">
            <h2>✅ Results</h2>
            <div id="stats"></div>

            <div class="download-buttons">
                <button id="downloadCsv">📥 Download as CSV</button>
                <button id="downloadExcel">📥 Download as Excel</button>
            </div>

            <div id="preview"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
