<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📚 Author Data Matcher</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>📚 Author Data Matcher</h1>
        <p>
            Upload a single <strong>CSV file</strong> containing your author records.  
            The script will group rows by <em>EmailAddress</em> or <em>AuthorID</em>,  
            deduplicate DOIs/UTs, remove redundant empty rows, and generate a clean template.  
        </p>

        <div class="upload-section">
            <label>📁 Upload File (CSV):</label>
            <input type="file" id="templateFile" accept=".csv">

            <button id="processBtn" disabled>▶️ Process File</button>
        </div>

        <div id="resultSection" style="display:none;">
            <h2>✅ Results</h2>
            <div id="stats"></div>

            <!-- All download buttons in one place -->
            <div id="downloadButtons" class="download-buttons">
                <button id="downloadCsv">📥 Download as CSV</button>
                <button id="downloadExcel">📥 Download as Excel</button>
                <!-- Gaps buttons will be injected dynamically -->
            </div>

            <div id="preview"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
