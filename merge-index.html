<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>👥 Employee / Researcher Data Merger</title>
  <link rel="stylesheet" href="merge-style.css">
</head>

<body>
  <div class="container">
    <h1>👥 Employee / Researcher Data Merger</h1>

    <p>
      Upload your <strong>Template CSV</strong> (to be updated) and <strong>Data CSV</strong> (source file).<br>
      The tool matches by <code>EmailAddress</code> or <code>PersonID</code>, fills missing fields, and prevents duplicates.
    </p>

    <div class="upload-section">
      <label>📁 Upload Template (CSV):</label><br>
      <input type="file" id="templateFile" accept=".csv"><br><br>

      <label>📁 Upload Data File (CSV):</label><br>
      <input type="file" id="dataFile" accept=".csv"><br><br>

      <button id="processBtn">▶️ Compare & Merge</button>
      <button id="downloadBtn">📥 Download Merged CSV</button>
    </div>

    <div id="resultSection" style="display:none;">
      <h2>✅ Results</h2>
      <div id="stats"></div>
      <div id="preview"></div>
    </div>
  </div>

  <script src="merge-script.js"></script>
</body>
</html>
